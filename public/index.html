<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MKT·TERMINAL — лента финансовых новостей</title>
<meta name="description" content="Оперативные новости финансов и рынков из 20 источников. Без VPN.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090c; --panel:#0d1117; --line:#1b232e;
  --amber:#ffb000; --red:#ff5252; --green:#2ee06f; --blue:#4db8ff; --violet:#b48cff;
  --tx:#c9d4e0; --dim:#5b6b7c;
  --mono:"IBM Plex Mono","SF Mono",Consolas,Menlo,monospace;
  --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans)}
a{color:inherit;text-decoration:none}

/* ── шапка ── */
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:9px 14px}
.logo{color:var(--amber);font-weight:700;letter-spacing:.08em;white-space:nowrap;font-family:var(--mono)}
.live{display:flex;align-items:center;gap:6px;color:var(--green);font-size:11px;letter-spacing:.12em;font-family:var(--mono)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:bl 1.6s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.sp{flex:1}
#q{background:var(--bg);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:12.5px;
  padding:4px 10px;border-radius:4px;width:200px;max-width:38vw;outline:none}
#q:focus{border-color:var(--amber)}
#q::placeholder{color:var(--dim)}
.hbtn{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:11px;
  padding:4px 9px;border-radius:4px;cursor:pointer;white-space:nowrap}
.hbtn.on{color:var(--amber);border-color:var(--amber)}
a.hbtn{display:inline-block}
#clock{color:var(--dim);font-size:12px;min-width:66px;text-align:right;font-family:var(--mono)}

/* ── фильтры ── */
nav{position:sticky;top:41px;z-index:19;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;padding:7px 14px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav.off{opacity:.35;pointer-events:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--dim);font:inherit;
  font-size:11.5px;padding:4px 10px;border-radius:20px;cursor:pointer}
.chip.on{color:#0b0d10;background:var(--amber);border-color:var(--amber);font-weight:700}
.chip.imp.on{background:var(--red);border-color:var(--red);color:#fff}
.vr{flex:none;width:1px;height:18px;background:var(--line);margin:0 4px}

/* ── лента ── */
main{max-width:860px;margin:0 auto;padding:8px 0 60px}
.row{display:grid;grid-template-columns:52px 1fr;gap:0 12px;padding:11px 14px;border-bottom:1px solid var(--line);
  position:relative;transition:background .3s}
.row .time{color:var(--dim);font-size:12px;padding-top:2px;font-family:var(--mono)}
.row .src{color:var(--blue);font-size:10.5px;letter-spacing:.04em;margin-bottom:3px}
.row .txt{white-space:pre-wrap;word-break:break-word}
mark{background:var(--amber);color:#0b0d10;border-radius:2px;padding:0 1px}
.row.clickable{cursor:pointer}
.more{color:var(--amber);font-size:10.5px;margin-top:3px}
.row.open .more{display:none}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.tag{font-size:10.5px;color:var(--violet);border:1px solid #2a2440;background:#161226;
  padding:1px 8px;border-radius:10px;cursor:pointer}
.tk{font-size:10.5px;color:var(--green);border:1px solid #14361f;background:#0b1a10;padding:1px 8px;border-radius:10px;font-family:var(--mono)}
.srcs{font-size:10.5px;color:var(--green)}
.lnk{font-size:10.5px;color:var(--dim)}
.lnk:hover{color:var(--blue)}
.share{background:none;border:none;color:var(--dim);cursor:pointer;font:inherit;font-size:10.5px;padding:0}
.share:hover{color:var(--blue)}

/* важные */
.row.lvl2{grid-template-columns:24px 52px 1fr;border:1px solid var(--red);border-left:none;
  background:rgba(255,82,82,.13);margin:8px 10px;padding:12px 14px 12px 0;border-radius:0 4px 4px 0}
.fband{background:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:6px 0;border-radius:3px 0 0 3px}
.vtxt{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.18em}
.ico{font-size:11px}
.row.lvl2 .time{color:var(--red);font-weight:600}
.row.fresh{animation:fr 2.4s ease both}
@keyframes fr{0%{background:rgba(255,176,0,.25)}100%{background:transparent}}
.row.lvl2.fresh{animation:fr2 2.4s ease both}
@keyframes fr2{0%{background:rgba(255,82,82,.35)}100%{background:rgba(255,82,82,.13)}}
.row.mark{outline:2px solid var(--amber);outline-offset:-2px}

/* всплывающий график */
#tvpop{position:fixed;z-index:50;width:340px;height:240px;background:var(--panel);
  border:1px solid var(--amber);border-radius:6px;overflow:hidden;display:none;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#tvpop iframe{width:100%;height:100%;border:0}

/* кнопка старых новостей */
.oldbtn{display:block;margin:18px auto 0;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  font:inherit;font-size:12px;padding:8px 18px;border-radius:6px;cursor:pointer}
.oldbtn:hover{color:var(--amber);border-color:var(--amber)}

/* компактный режим */
body.compact .row{padding:5px 14px}
body.compact .row .meta{margin-top:3px}
body.compact .row .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.compact .row.lvl2{padding:6px 10px 6px 0;margin:4px 10px}

@media(max-width:640px){
  body{font-size:13.5px}
  header{padding:8px 10px;gap:7px;flex-wrap:wrap}
  .live{display:none}
  #q{width:130px;max-width:34vw;font-size:12px}
  nav{padding:6px 10px;top:38px}
  .row{grid-template-columns:42px 1fr;gap:0 9px;padding:10px 10px}
  .row.lvl2{grid-template-columns:20px 42px 1fr;margin:6px 6px;padding:10px 10px 10px 0}
  .row .time{font-size:11px}
}
.note{color:var(--dim);text-align:center;padding:40px 20px;font-size:12.5px}
footer{color:var(--dim);font-size:11px;text-align:center;padding:20px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <span class="logo">MKT·TERMINAL</span>
  <span class="live"><span class="dot"></span>LIVE</span>
  <span class="sp"></span>
  <input id="q" type="search" placeholder="поиск по новостям…" autocomplete="off">
  <button class="hbtn" id="sndBtn" title="звук важных новостей">🔇</button>
  <button class="hbtn" id="denBtn">плотно</button>
  <a class="hbtn" href="/map">карта</a>
  <span id="clock">--:--:--</span>
</header>
<nav id="nav"></nav>
<main id="feed"><div class="note">Загружаю ленту…</div></main>
<footer>MKT·TERMINAL · агрегатор открытых источников · под каждой новостью — ссылка на первоисточник</footer>
<div id="tvpop"></div>

<script>
'use strict';
// ── состояние ──
let ITEMS = [];
let filterTag = 'all';      // all | imp | тег
let filterDay = '24h';      // 24h | morning | day | evening
let sound = false;
let searchQ = '';           // строка живого поиска
let searchOld = false;      // искать глубже 24 часов
const knownIds = new Set();
let firstLoad = true;

// сохранённые настройки
try{
  const p = JSON.parse(localStorage.getItem('mkt_prefs')||'{}');
  if(p.compact) document.body.classList.add('compact');
  if(p.filterTag) filterTag = p.filterTag;
  if(p.filterDay) filterDay = p.filterDay;
}catch(e){}
function savePrefs(){
  try{localStorage.setItem('mkt_prefs',JSON.stringify({
    compact:document.body.classList.contains('compact'),filterTag,filterDay}))}catch(e){}
}

// ── часы ──
const clock=document.getElementById('clock');
setInterval(()=>{clock.textContent=new Date().toLocaleTimeString('ru-RU',{timeZone:'Europe/Moscow'})},1000);

// ── кнопки шапки ──
const sndBtn=document.getElementById('sndBtn');
sndBtn.onclick=()=>{sound=!sound;sndBtn.textContent=sound?'🔊':'🔇';sndBtn.classList.toggle('on',sound)};
const denBtn=document.getElementById('denBtn');
function denLabel(){denBtn.textContent=document.body.classList.contains('compact')?'свободно':'плотно'}
denBtn.onclick=()=>{document.body.classList.toggle('compact');denLabel();savePrefs()};
denLabel();

// ── живой поиск ──
const qInput=document.getElementById('q');
qInput.addEventListener('input',()=>{
  searchQ=qInput.value.trim();
  if(!searchQ)searchOld=false;
  renderAll();
});

// ── звук ──
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=880;g.gain.setValueAtTime(.12,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.35);
    o.start();o.stop(ctx.currentTime+.35);
  }catch(e){}
}

// ── время суток (МСК) ──
function mskHour(iso){
  return +new Date(iso).toLocaleString('en-GB',{timeZone:'Europe/Moscow',hour:'2-digit',hour12:false});
}
function passDay(x){
  if(filterDay==='24h')return true;
  const h=mskHour(x.time);
  if(filterDay==='morning')return h<9;
  if(filterDay==='day')return h>=9&&h<19;
  return h>=19;
}
function passTag(x){
  if(filterTag==='all')return true;
  if(filterTag==='imp')return x.lvl===2;
  return (x.tags||[]).includes(filterTag)||x.src===filterTag;
}

// ── фильтры ──
function topTags(){
  const cnt={};
  for(const x of ITEMS)for(const t of (x.tags||[]))cnt[t]=(cnt[t]||0)+1;
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,7).map(e=>e[0]);
}
function renderNav(){
  const nav=document.getElementById('nav');
  nav.classList.toggle('off',!!searchQ);
  const chips=[
    {id:'all',label:'Все'},
    {id:'imp',label:'⚡ Важно',cls:'imp'},
    ...topTags().map(t=>({id:t,label:'#'+t}))
  ];
  const days=[{id:'24h',label:'24ч'},{id:'morning',label:'утро'},{id:'day',label:'день'},{id:'evening',label:'вечер'}];
  nav.innerHTML=
    chips.map(c=>'<button class="chip '+(c.cls||'')+(filterTag===c.id?' on':'')+'" data-t="'+c.id+'">'+c.label+'</button>').join('')
    +'<span class="vr"></span>'
    +days.map(d=>'<button class="chip'+(filterDay===d.id?' on':'')+'" data-d="'+d.id+'">'+d.label+'</button>').join('');
  nav.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{filterTag=b.dataset.t;savePrefs();renderAll();window.scrollTo({top:0})});
  nav.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{filterDay=b.dataset.d;savePrefs();renderAll();window.scrollTo({top:0})});
}

// ── сворачивание по границе предложения ──
function collapseText(t){
  const parts=t.split(/(?<=[.!?…])\s+/);
  let out=parts[0]||'';
  if(out.trim().split(/\s+/).length<5&&parts[1])out+=' '+parts[1];
  return out;
}

// ── рендер строки ──
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function hi(html){
  if(!searchQ)return html;
  try{return html.replace(new RegExp('('+escRe(esc(searchQ))+')','gi'),'<mark>$1</mark>')}catch(e){return html}
}
function hhmm(iso){return new Date(iso).toLocaleTimeString('ru-RU',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit'})}
const openIds=new Set();
function rowHTML(x,fresh){
  const band=x.lvl===2?'<div class="fband"><span class="vtxt">Важно</span><span class="ico">⚡</span></div>':'';
  const tags=(x.tags||[]).map(t=>'<span class="tag" data-tag="'+t+'">#'+t+'</span>').join('');
  const tks=(x.tk||[]).map(t=>'<a class="tk" data-tk="'+t+'" target="_blank" rel="noopener" href="https://www.tradingview.com/chart/?symbol=MOEX%3A'+t+'">'+t+'</a>').join('');
  const srcs=x.srcCount>1?'<span class="srcs">'+x.srcCount+' источника</span>':'';
  const col=collapseText(x.text);
  const long=col.length<x.text.length-15;
  const open=openIds.has(x.id);
  const shown=(long&&!open)?col+' …':x.text;
  const more=long?'<div class="more">развернуть ⌄</div>':'';
  return '<article class="row'+(x.lvl===2?' lvl2':'')+(fresh?' fresh':'')+(long?' clickable':'')+(open?' open':'')+'" id="n-'+x.id+'">'+band+
    '<div class="time">'+hhmm(x.time)+'</div>'+
    '<div><div class="src">'+esc(x.srcName)+'</div>'+
    '<div class="txt">'+hi(esc(shown))+'</div>'+more+
    '<div class="meta">'+tags+tks+srcs+
      '<a class="lnk" target="_blank" rel="noopener" href="'+x.url+'">первоисточник ↗</a>'+
      '<button class="share" data-id="'+x.id+'">поделиться</button>'+
    '</div></div></article>';
}
function renderAll(){
  renderNav();
  const feed=document.getElementById('feed');
  let vis;
  if(searchQ){
    const q=searchQ.toLowerCase();
    const cutoff=searchOld?0:Date.now()-24*3600*1000;
    vis=ITEMS.filter(x=>x.text.toLowerCase().includes(q)&&new Date(x.time).getTime()>cutoff);
  }else{
    vis=ITEMS.filter(x=>passTag(x)&&passDay(x));
  }
  let html=vis.length?vis.map(x=>rowHTML(x,false)).join(''):'<div class="note">'+(searchQ?'Ничего не нашлось за последние сутки.':'По этому фильтру пока пусто.')+'</div>';
  if(searchQ&&!searchOld)html+='<button class="oldbtn" id="oldBtn">найти более старые новости</button>';
  feed.innerHTML=html;
  const ob=document.getElementById('oldBtn');
  if(ob)ob.onclick=()=>{searchOld=true;renderAll()};
  bindRowEvents();
}
function bindRowEvents(){
  document.querySelectorAll('.row.clickable').forEach(r=>{
    r.onclick=e=>{
      if(e.target.closest('a,button,.tag'))return;
      const id=r.id.slice(2);
      if(openIds.has(id))openIds.delete(id);else openIds.add(id);
      renderAll();
    };
  });
  document.querySelectorAll('.tag').forEach(t=>{t.onclick=e=>{e.stopPropagation();qInput.value='';searchQ='';filterTag=t.dataset.tag;savePrefs();renderAll();window.scrollTo({top:0})}});
  document.querySelectorAll('.share').forEach(b=>b.onclick=async()=>{
    const x=ITEMS.find(i=>i.id===b.dataset.id); if(!x)return;
    const link=location.origin+'/?n='+encodeURIComponent(x.id);
    const short=x.text.split('\n')[0].slice(0,140);
    if(navigator.share){try{await navigator.share({title:'MKT·TERMINAL',text:short,url:link});return}catch(e){}}
    try{await navigator.clipboard.writeText(short+'\n'+link);b.textContent='скопировано ✓';setTimeout(()=>b.textContent='поделиться',1500)}catch(e){}
  });
}

// ── всплывающий график TradingView ──
const tvpop=document.getElementById('tvpop');
let tvTimer=null,tvCur=null;
const canHover=window.matchMedia&&window.matchMedia('(hover:hover)').matches;
function tvShow(el,sym){
  const r=el.getBoundingClientRect();
  let x=r.left,y=r.bottom+8;
  if(x+340>innerWidth-8)x=innerWidth-348;
  if(y+240>innerHeight-8)y=r.top-248;
  tvpop.style.left=Math.max(8,x)+'px';
  tvpop.style.top=Math.max(8,y)+'px';
  tvpop.innerHTML='<iframe loading="eager" src="https://s.tradingview.com/widgetembed/?symbol=MOEX%3A'+sym+'&interval=5&hidesidetoolbar=1&hidetoptoolbar=1&hidelegend=1&saveimage=0&theme=dark&style=1&timezone=Europe%2FMoscow&locale=ru"></iframe>';
  tvpop.style.display='block';
  tvCur=sym;
}
function tvHide(){tvpop.style.display='none';tvpop.innerHTML='';tvCur=null}
if(canHover){
  document.addEventListener('mouseover',e=>{
    const tk=e.target.closest('.tk');
    if(tk){
      clearTimeout(tvTimer);
      const sym=tk.dataset.tk;
      if(tvCur===sym)return;
      tvTimer=setTimeout(()=>tvShow(tk,sym),350);
    }else if(!e.target.closest('#tvpop')){
      clearTimeout(tvTimer);
      tvTimer=setTimeout(tvHide,250);
    }
  });
}

// ── загрузка ──
async function load(){
  try{
    const r=await fetch('/api/feed');
    const data=await r.json();
    if(!data.items)return;
    let newImportant=false,anyNew=false;
    for(const x of data.items){
      if(!knownIds.has(x.id)){
        if(!firstLoad){x._fresh=true;anyNew=true;if(x.lvl===2)newImportant=true;}
        knownIds.add(x.id);
      }
    }
    ITEMS=data.items;
    renderAll();
    if(anyNew){
      document.querySelectorAll('.row').forEach(el=>{
        const id=el.id.slice(2);
        const x=ITEMS.find(i=>i.id===id);
        if(x&&x._fresh){el.classList.add('fresh');delete x._fresh}
      });
    }
    if(newImportant&&sound)beep();
    if(firstLoad){
      firstLoad=false;
      const n=new URLSearchParams(location.search).get('n');
      if(n){const el=document.getElementById('n-'+n);
        if(el){el.scrollIntoView({block:'center'});el.classList.add('mark')}}
    }
  }catch(e){
    if(firstLoad)document.getElementById('feed').innerHTML='<div class="note">Не удалось загрузить ленту. Обнови страницу.</div>';
  }
}
load();
setInterval(load,90000);
</script>
</body>
</html>
