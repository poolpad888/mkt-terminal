<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2213%22%20fill%3D%22%230d1117%22%20stroke%3D%22%231b232e%22%20stroke-width%3D%223%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2233%22%20font-family%3D%22monospace%22%20font-weight%3D%22700%22%20font-size%3D%2242%22%20fill%3D%22%23ffb000%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%3EF%3C%2Ftext%3E%3C%2Fsvg%3E">
<title>Котировки рынков — FINFACTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090c; --panel:#0d1117; --line:#1b232e;
  --amber:#ffb000; --red:#ff5252; --green:#2ee06f; --blue:#4db8ff; --violet:#b48cff;
  --tx:#c9d4e0; --dim:#5b6b7c;
  --mono:"IBM Plex Mono","SF Mono",Consolas,Menlo,monospace;
  --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
}
html.light{
  --bg:#f7f8fa; --panel:#ffffff; --line:#dde3ea;
  --amber:#b06f00; --red:#c62828; --green:#0f7a3d; --blue:#1565c0; --violet:#6a3fb5;
  --tx:#1c2530; --dim:#6b7a8a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:12.5px/1.45 var(--sans)}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:9px 14px}
.logo{color:var(--amber);font-weight:700;letter-spacing:.08em;white-space:nowrap;font-family:var(--mono)}
.sub{color:var(--dim);font-size:12px}
.sp{flex:1}
.hbtn{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:11px;
  padding:4px 9px;border-radius:4px;cursor:pointer;white-space:nowrap;display:inline-block}
.hbtn:hover{color:var(--amber);border-color:var(--amber)}
#clock{color:var(--dim);font-size:12px;font-family:var(--mono)}

main{max-width:1080px;margin:0 auto;padding:16px 14px 60px}
.top{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.top h1{font-size:15px;font-weight:700;letter-spacing:.02em}
.upd{color:var(--dim);font-size:11.5px;font-family:var(--mono)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  padding:11px 14px 9px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .d{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}
.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;
  padding:9px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:hover{background:rgba(255,176,0,.04)}
.nm{color:var(--tx);font-size:13px}
.val{font-family:var(--mono);text-align:right;font-weight:600;font-size:13px;min-width:78px}
.chg{font-family:var(--mono);text-align:right;font-weight:600;font-size:12.5px;min-width:64px}
.chg.up{color:var(--green)} .chg.up::before{content:"▲ "}
.chg.dn{color:var(--red)}  .chg.dn::before{content:"▼ "}
.chg.na{color:var(--dim);font-weight:400}
.empty{padding:14px;color:var(--dim);font-size:12px;text-align:center}
.note{color:var(--dim);text-align:center;padding:40px 20px;font-size:12.5px}
.foot{color:var(--dim);font-size:11px;text-align:center;margin-top:22px;line-height:1.6}
.skel{opacity:.5}
</style>
</head>
<body>
<header>
  <span class="logo">FINFACTS</span>
  <span class="sub">Котировки · Московская биржа</span>
  <span class="sp"></span>
  <a class="hbtn" href="/">← лента</a>
  <a class="hbtn" href="/map">карта</a>
  <button class="hbtn" id="thBtn" title="светлая / тёмная тема">◑</button>
  <span id="clock">--:--:--</span>
</header>
<main>
  <div class="top">
    <h1>Котировки рынков</h1>
    <span class="upd" id="upd">загрузка…</span>
  </div>
  <div class="grid" id="grid">
    <div class="note">Загружаю котировки…</div>
  </div>
  <div class="foot">
    Данные Московской биржи (ISS), задержка до 15 минут · обновление раз в минуту<br>
    Приводится справочно, не является инвестиционной рекомендацией. 18+
  </div>
</main>
<script>
// тема
try{const p=JSON.parse(localStorage.getItem('mkt_prefs')||'{}');if(p.light)document.documentElement.classList.add('light')}catch(e){}
const thBtn=document.getElementById('thBtn');
function thLabel(){thBtn.textContent=document.documentElement.classList.contains('light')?'◕':'◑'}
thBtn.onclick=()=>{
  document.documentElement.classList.toggle('light');thLabel();
  try{const p=JSON.parse(localStorage.getItem('mkt_prefs')||'{}');p.light=document.documentElement.classList.contains('light');localStorage.setItem('mkt_prefs',JSON.stringify(p))}catch(e){}
};
thLabel();

// часы
const clock=document.getElementById('clock');
setInterval(()=>{clock.textContent=new Date().toLocaleTimeString('ru-RU',{timeZone:'Europe/Moscow'})},1000);

const SECTIONS=[
  ['commodities','Сырьё'],
  ['indices','Индексы'],
  ['fx','Валюты'],
  ['stocks','Акции'],
];
function fmtVal(v){
  if(v==null)return '—';
  const dp=Math.abs(v)>=1?2:4;
  return v.toLocaleString('ru-RU',{minimumFractionDigits:dp,maximumFractionDigits:dp});
}
function chgCell(c){
  if(c==null)return '<span class="chg na">—</span>';
  const cls=c>0?'up':c<0?'dn':'na';
  return '<span class="chg '+cls+'">'+Math.abs(c).toFixed(2)+'%</span>';
}
function render(data){
  const g=document.getElementById('grid');
  const s=data.sections||{};
  let html='';
  for(const [key,title] of SECTIONS){
    const rows=s[key]||[];
    html+='<div class="card"><h2><span class="d"></span>'+title+'</h2>';
    if(!rows.length){
      html+='<div class="empty">нет данных</div>';
    }else{
      for(const r of rows){
        html+='<div class="row"><span class="nm">'+r.name+'</span>'
             +'<span class="val">'+fmtVal(r.val)+'</span>'+chgCell(r.chg)+'</div>';
      }
    }
    html+='</div>';
  }
  g.innerHTML=html;
  const t=data.updated?new Date(data.updated):null;
  document.getElementById('upd').textContent=t
    ? 'обновлено '+t.toLocaleTimeString('ru-RU',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit'})
    : '';
}
async function load(){
  try{
    const r=await fetch('/api/markets',{cache:'no-store'});
    const d=await r.json();
    render(d);
  }catch(e){
    document.getElementById('grid').innerHTML='<div class="note">Не удалось загрузить котировки. Обнови страницу.</div>';
  }
}
load();
setInterval(load,60*1000);
</script>
</body>
</html>
