<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2213%22%20fill%3D%22%230d1117%22%20stroke%3D%22%231b232e%22%20stroke-width%3D%223%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2233%22%20font-family%3D%22monospace%22%20font-weight%3D%22700%22%20font-size%3D%2242%22%20fill%3D%22%23ffb000%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%3EF%3C%2Ftext%3E%3C%2Fsvg%3E">
<title>Котировки рынков — FINFACTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090c; --panel:#0d1117; --line:#1b232e;
  --amber:#ffb000; --red:#ff5252; --green:#2ee06f; --blue:#4db8ff; --violet:#b48cff;
  --tx:#c9d4e0; --dim:#5b6b7c;
  --mono:"IBM Plex Mono","SF Mono",Consolas,Menlo,monospace;
  --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
}
html.light{
  --bg:#f7f8fa; --panel:#ffffff; --line:#dde3ea;
  --amber:#b06f00; --red:#c62828; --green:#0f7a3d; --blue:#1565c0; --violet:#6a3fb5;
  --tx:#1c2530; --dim:#6b7a8a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:12.5px/1.45 var(--sans)}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:9px 14px}
.logo{color:var(--amber);font-weight:700;letter-spacing:.08em;white-space:nowrap;font-family:var(--mono)}
.sub{color:var(--dim);font-size:12px}
.sp{flex:1}
.hbtn{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:11px;
  padding:4px 9px;border-radius:4px;cursor:pointer;white-space:nowrap;display:inline-block}
.hbtn:hover{color:var(--amber);border-color:var(--amber)}
#clock{color:var(--dim);font-size:12px;font-family:var(--mono)}

main{max-width:1080px;margin:0 auto;padding:16px 14px 60px}
.top{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.top h1{font-size:15px;font-weight:700;letter-spacing:.02em}
.top .note{color:var(--dim);font-size:11.5px}
#wrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;height:76vh;min-height:520px}
#wrap .tradingview-widget-container,#wrap .tradingview-widget-container__widget{height:100%;width:100%}
.foot{color:var(--dim);font-size:11px;text-align:center;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<header>
  <span class="logo">FINFACTS</span>
  <span class="sub">Котировки · мировые рынки</span>
  <span class="sp"></span>
  <a class="hbtn" href="/">← лента</a>
  <a class="hbtn" href="/map">карта</a>
  <button class="hbtn" id="thBtn" title="светлая / тёмная тема">◑</button>
  <span id="clock">--:--:--</span>
</header>
<main>
  <div class="top">
    <h1>Котировки рынков</h1>
    <span class="note">сырьё · индексы · валюты · крипта · акции РФ — реальное время, данные TradingView</span>
  </div>
  <div id="wrap"></div>
  <div class="foot">
    Котировки предоставлены TradingView · приводятся справочно, не являются инвестиционной рекомендацией. 18+
  </div>
</main>
<script>
// тема (общий ключ с лентой)
try{const p=JSON.parse(localStorage.getItem('mkt_prefs')||'{}');if(p.light)document.documentElement.classList.add('light')}catch(e){}
const thBtn=document.getElementById('thBtn');
function isLight(){return document.documentElement.classList.contains('light')}
function thLabel(){thBtn.textContent=isLight()?'◕':'◑'}
thBtn.onclick=()=>{
  document.documentElement.classList.toggle('light');thLabel();
  try{const p=JSON.parse(localStorage.getItem('mkt_prefs')||'{}');p.light=isLight();localStorage.setItem('mkt_prefs',JSON.stringify(p))}catch(e){}
  buildWidget();
};
thLabel();

// часы (МСК)
const clock=document.getElementById('clock');
setInterval(()=>{clock.textContent=new Date().toLocaleTimeString('ru-RU',{timeZone:'Europe/Moscow'})},1000);

// виджет TradingView — пересобираем при смене темы
const TABS=[
  {title:"Сырьё",symbols:[
    {s:"TVC:UKOIL",d:"Нефть Brent"},{s:"TVC:USOIL",d:"Нефть WTI"},{s:"TVC:GOLD",d:"Золото"},
    {s:"TVC:SILVER",d:"Серебро"},{s:"NYMEX:NG1!",d:"Природный газ"},{s:"COMEX:HG1!",d:"Медь"}]},
  {title:"Индексы",symbols:[
    {s:"SP:SPX",d:"S&P 500"},{s:"NASDAQ:IXIC",d:"Nasdaq"},{s:"DJ:DJI",d:"Dow Jones"},
    {s:"XETR:DAX",d:"DAX"},{s:"TVC:NI225",d:"Nikkei 225"},{s:"MOEX:IMOEX",d:"Индекс МосБиржи"}]},
  {title:"Валюты",symbols:[
    {s:"FX:EURUSD",d:"EUR/USD"},{s:"FX_IDC:USDRUB",d:"USD/RUB"},{s:"FX_IDC:EURRUB",d:"EUR/RUB"},
    {s:"FX_IDC:CNYRUB",d:"CNY/RUB"},{s:"TVC:DXY",d:"Индекс доллара"},{s:"FX:USDJPY",d:"USD/JPY"}]},
  {title:"Крипта",symbols:[
    {s:"BINANCE:BTCUSDT",d:"Bitcoin"},{s:"BINANCE:ETHUSDT",d:"Ethereum"},{s:"BINANCE:BNBUSDT",d:"BNB"},
    {s:"BINANCE:SOLUSDT",d:"Solana"},{s:"BINANCE:XRPUSDT",d:"XRP"},{s:"BINANCE:TONUSDT",d:"Toncoin"}]},
  {title:"Акции РФ",symbols:[
    {s:"MOEX:SBER",d:"Сбербанк"},{s:"MOEX:GAZP",d:"Газпром"},{s:"MOEX:LKOH",d:"Лукойл"},
    {s:"MOEX:GMKN",d:"Норникель"},{s:"MOEX:ROSN",d:"Роснефть"},{s:"MOEX:YDEX",d:"Яндекс"}]},
];
function buildWidget(){
  const wrap=document.getElementById('wrap');
  wrap.innerHTML='';
  const cont=document.createElement('div');
  cont.className='tradingview-widget-container';
  const w=document.createElement('div');
  w.className='tradingview-widget-container__widget';
  cont.appendChild(w);
  const cfg={
    colorTheme:isLight()?'light':'dark',
    dateRange:'1D',
    locale:'ru',
    showChart:true,
    largeChartUrl:'',
    isTransparent:true,
    showSymbolLogo:true,
    showFloatingTooltip:true,
    width:'100%',
    height:'100%',
    plotLineColorGrowing:'#2ee06f',
    plotLineColorFalling:'#ff5252',
    gridLineColor:'rgba(120,130,145,0.12)',
    scaleFontColor:isLight()?'#1c2530':'#c9d4e0',
    belowLineFillColorGrowing:'rgba(46,224,111,0.10)',
    belowLineFillColorFalling:'rgba(255,82,82,0.10)',
    belowLineFillColorGrowingBottom:'rgba(46,224,111,0)',
    belowLineFillColorFallingBottom:'rgba(255,82,82,0)',
    symbolActiveColor:'rgba(255,176,0,0.14)',
    tabs:TABS
  };
  const sc=document.createElement('script');
  sc.type='text/javascript';
  sc.async=true;
  sc.src='https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js';
  sc.textContent=JSON.stringify(cfg);
  cont.appendChild(sc);
  wrap.appendChild(cont);
}
buildWidget();
</script>
</body>
</html>
