<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2213%22%20fill%3D%22%230d1117%22%20stroke%3D%22%231b232e%22%20stroke-width%3D%223%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2233%22%20font-family%3D%22monospace%22%20font-weight%3D%22700%22%20font-size%3D%2242%22%20fill%3D%22%23ffb000%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%3EF%3C%2Ftext%3E%3C%2Fsvg%3E">
<title>Примерочная шрифтов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090c; --panel:#0d1117; --line:#1b232e;
  --fg:#d7dde6; --dim:#77839a; --amber:#ffb000; --red:#ff5252; --green:#2ee06f; --blue:#4db8ff;
  --mono-cur: ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace;
  --jb: 'JetBrains Mono', monospace;
  --plexm: 'IBM Plex Mono', monospace;
  --inter: 'Inter', system-ui, sans-serif;
  --plexs: 'IBM Plex Sans', system-ui, sans-serif;
  --pts: 'PT Sans', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-size:14px;line-height:1.45;font-family:var(--mono-cur)}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 12px}
h1{font-size:13px;color:var(--amber);letter-spacing:.06em;margin-bottom:8px;text-transform:uppercase}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:transparent;color:var(--dim);padding:7px 10px;font:inherit;font-size:12px;cursor:pointer;border-radius:4px}
.tab.on{color:#0b0d10;background:var(--amber);border-color:var(--amber);font-weight:600}
.note{color:var(--dim);font-size:12px;margin-top:8px}
main{max-width:860px;margin:0 auto;padding:8px 0 60px}
.row{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:baseline}
.t{color:var(--dim);font-size:12px;min-width:44px}
.src{color:var(--blue);font-size:11px;min-width:86px;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt{flex:1}
.tk{color:var(--green);font-size:11px;margin-left:6px;white-space:nowrap}
.imp .txt{color:#ffd9d9}
.imp{background:rgba(255,82,82,.07);border-left:3px solid var(--red)}
/* числовые/служебные элементы */
.t,.src,.tk{font-family:var(--numfont, inherit)}
/* варианты */
body[data-v="1"]{--txtfont:var(--mono-cur);--numfont:var(--mono-cur)}
body[data-v="2"]{--txtfont:var(--jb);--numfont:var(--jb)}
body[data-v="3"]{--txtfont:var(--plexm);--numfont:var(--plexm)}
body[data-v="4"]{--txtfont:var(--inter);--numfont:var(--jb);font-size:14.5px}
body[data-v="5"]{--txtfont:var(--plexs);--numfont:var(--plexm);font-size:14.5px}
body[data-v="6"]{--txtfont:var(--pts);--numfont:var(--pts);font-size:15px}
.txt{font-family:var(--txtfont)}
@media(max-width:640px){ .src{display:none} body{font-size:13px} }
</style>
</head>
<body data-v="1">
<header>
  <h1>Примерочная шрифтов</h1>
  <div class="tabs" id="tabs">
    <button class="tab on" data-v="1">1 · как сейчас</button>
    <button class="tab" data-v="2">2 · JetBrains Mono</button>
    <button class="tab" data-v="3">3 · IBM Plex Mono</button>
    <button class="tab" data-v="4">4 · гибрид: Inter + моно-цифры</button>
    <button class="tab" data-v="5">5 · гибрид: IBM Plex Sans + моно-цифры</button>
    <button class="tab" data-v="6">6 · обычный: PT Sans</button>
  </div>
  <div class="note">Лента настоящая, с сайта. Нажимай кнопки и сравнивай. Понравившийся — просто назови номер.</div>
</header>
<main id="feed"><div class="row"><div class="txt" style="color:var(--dim)">Загружаю ленту…</div></div></main>
<script>
document.getElementById('tabs').addEventListener('click', e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  document.body.dataset.v=b.dataset.v;
});
fetch('/api/feed').then(r=>r.json()).then(d=>{
  const items=(d.items||[]).slice(0,14);
  const f=document.getElementById('feed'); f.innerHTML='';
  for(const it of items){
    const r=document.createElement('div');
    r.className='row'+(it.importance==='high'?' imp':'');
    const time=new Date(it.ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'});
    const tks=(it.tickers||[]).slice(0,3).map(t=>'$'+t).join(' ');
    r.innerHTML='<div class="t">'+time+'</div><div class="src">'+(it.sourceName||'')+'</div><div class="txt"></div>'+(tks?'<div class="tk">'+tks+'</div>':'');
    r.querySelector('.txt').textContent=(it.text||'').slice(0,220);
    f.appendChild(r);
  }
}).catch(()=>{document.getElementById('feed').innerHTML='<div class="row"><div class="txt">Не удалось загрузить ленту</div></div>'});
</script>
</body>
</html>
