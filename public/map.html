<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2213%22%20fill%3D%22%230d1117%22%20stroke%3D%22%231b232e%22%20stroke-width%3D%223%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2233%22%20font-family%3D%22monospace%22%20font-weight%3D%22700%22%20font-size%3D%2242%22%20fill%3D%22%23ffb000%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%3EF%3C%2Ftext%3E%3C%2Fsvg%3E">
<title>Новостная карта рынков — FINFACTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090c; --panel:#0d1117; --line:#1b232e;
  --amber:#ffb000; --red:#ff5252; --green:#2ee06f; --blue:#4db8ff; --violet:#b48cff;
  --tx:#c9d4e0; --dim:#5b6b7c;
  --mono:"IBM Plex Mono","SF Mono",Consolas,Menlo,monospace;
  --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
}
html.light{
  --bg:#f7f8fa; --panel:#ffffff; --line:#dde3ea;
  --amber:#b06f00; --red:#c62828; --green:#0f7a3d; --blue:#1565c0; --violet:#6a3fb5;
  --tx:#1c2530; --dim:#6b7a8a;
}
html.light tr.r:hover td{background:rgba(176,111,0,.06)}
html.light tr.det td{background:#f2f4f7}
html.light .flow{background:#e6eaef}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:12.5px/1.45 var(--sans)}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:9px 14px}
.logo{color:var(--amber);font-weight:700;letter-spacing:.08em;white-space:nowrap;font-family:var(--mono)}
.sub{color:var(--dim);font-size:12px}
.sp{flex:1}
.hbtn{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:11px;
  padding:4px 9px;border-radius:4px;cursor:pointer;white-space:nowrap;display:inline-block}
.hbtn:hover{color:var(--amber);border-color:var(--amber)}
#clock{color:var(--dim);font-size:12px;font-family:var(--mono)}

main{max-width:900px;margin:0 auto;padding:14px 14px 60px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
#q{background:var(--panel);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:13px;
  padding:6px 12px;border-radius:5px;width:260px;max-width:60vw;outline:none}
#q:focus{border-color:var(--amber)}
#q::placeholder{color:var(--dim)}
.hint{color:var(--dim);font-size:11.5px}

table{width:100%;border-collapse:collapse}
th{color:var(--dim);font-size:11px;letter-spacing:.05em;text-align:left;padding:7px 8px;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--amber)}
th .ar{color:var(--amber)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.r{cursor:pointer}
tr.r:hover td{background:rgba(255,176,0,.05)}
.tkc{font-family:var(--mono);font-weight:600;color:var(--green)}
.nm{color:var(--tx)}
.num{font-family:var(--mono);text-align:right}
.imp{color:var(--red);font-weight:600;font-family:var(--mono);text-align:right}
.chg{font-family:var(--mono);text-align:right;font-weight:600}
.chg.up{color:var(--green)}
.chg.dn{color:var(--red)}
.chg.na{color:var(--dim);font-weight:400}
.tm{font-family:var(--mono);color:var(--dim);text-align:right;font-size:12.5px}
.flow{height:7px;background:#131a22;border-radius:4px;overflow:hidden;min-width:60px}
.flow i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--red));border-radius:4px}

tr.det td{background:var(--panel);padding:0}
.dbox{padding:10px 14px}
.dn1{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.dn1:last-child{border-bottom:none}
.dt{font-family:var(--mono);color:var(--dim);flex:none;font-size:12px;padding-top:1px}
.dx a{color:var(--dim);font-size:11px}
.dx a:hover{color:var(--blue)}
.dimp{color:var(--red);font-weight:600}
.note{color:var(--dim);text-align:center;padding:40px 20px;font-size:12.5px}
@media(max-width:640px){
  main{padding:10px 6px 60px}
  th,td{padding:6px 5px;font-size:12.5px}
  .flowtd{display:none}th.flowth{display:none}
  .tm,.tmth{display:none}
}
</style>
</head>
<body>
<header>
  <span class="logo">FINFACTS</span>
  <span class="sub">Новостная карта рынков · сегодня с 00:00 МСК</span>
  <span class="sp"></span>
  <a class="hbtn" href="/">← лента</a>
  <!-- <a class="hbtn" href="/quotes">котировки</a> -->
  <button class="hbtn" id="thBtn" title="светлая / тёмная тема">◑</button>
  <span id="clock">--:--:--</span>
</header>
<main>
  <div class="bar">
    <input id="q" type="search" placeholder="тикер или компания: SBER, Сбер…" autocomplete="off">
    <span class="hint">щёлкни по заголовку столбца — сортировка · щёлкни по строке — новости бумаги</span>
  </div>
  <table>
    <thead><tr>
      <th data-s="tk">Тикер <span class="ar"></span></th>
      <th data-s="nm">Компания <span class="ar"></span></th>
      <th data-s="n" style="text-align:right">Новостей <span class="ar"></span></th>
      <th class="flowth">Поток</th>
      <th data-s="imp" style="text-align:right">Важных <span class="ar"></span></th>
      <th data-s="chg" style="text-align:right">Изм. цены <span class="ar"></span></th>
      <th data-s="last" class="tmth" style="text-align:right">Последняя <span class="ar"></span></th>
    </tr></thead>
    <tbody id="tb"><tr><td colspan="7" class="note">Считаю карту…</td></tr></tbody>
  </table>
</main>
<script>
// тема (общая с лентой, хранится в mkt_prefs.light)
try{const p=JSON.parse(localStorage.getItem('mkt_prefs')||'{}');if(p.light)document.documentElement.classList.add('light')}catch(e){}
const thBtn=document.getElementById('thBtn');
function thLabel(){thBtn.textContent=document.documentElement.classList.contains('light')?'◕':'◑'}
thBtn.onclick=()=>{document.documentElement.classList.toggle('light');thLabel();
  try{const p=JSON.parse(localStorage.getItem('mkt_prefs')||'{}');p.light=document.documentElement.classList.contains('light');localStorage.setItem('mkt_prefs',JSON.stringify(p))}catch(e){}};
thLabel();

'use strict';
const NAMES = {"SBER":"Сбербанк","GAZP":"Газпром","SIBN":"Газпром нефть","LKOH":"Лукойл","ROSN":"Роснефть","NVTK":"Новатэк","TATN":"Татнефть","SNGS":"Сургутнефтегаз","GMKN":"Норникель","YDEX":"Яндекс","VTBR":"ВТБ","T":"Т-Банк","MOEX":"Мосбиржа","PLZL":"Полюс","CHMF":"Северсталь","NLMK":"НЛМК","MAGN":"ММК","ALRS":"Алроса","AFLT":"Аэрофлот","MGNT":"Магнит","X5":"X5 Group","OZON":"Озон","MTSS":"МТС","RUAL":"Русал","PHOR":"ФосАгро","AFKS":"АФК Система","HYDR":"РусГидро","IRAO":"Интер РАО","FLOT":"Совкомфлот","SVCB":"Совкомбанк","BSPB":"Банк СПб","UGLD":"ЮГК","SMLT":"Самолет","PIKK":"ПИК","VKCO":"VK","POSI":"Позитив","ASTR":"Астра","RTKM":"Ростелеком","TRNFP":"Транснефть","FEES":"Россети","RENI":"Ренессанс","ENPG":"Эн+","SGZH":"Сегежа","MTLR":"Мечел","RASP":"Распадская","UPRO":"Юнипро","LSRG":"ЛСР","ETLN":"Эталон","LENT":"Лента","HEAD":"Хэдхантер","BRENT":"Нефть Brent","WTI":"Нефть WTI","GAS":"Газ","GOLD":"Золото","SILVER":"Серебро","USDRUB":"Доллар/рубль","CNYRUB":"Юань/рубль","EURUSD":"Евро/доллар","IMOEX":"Индекс Мосбиржи"};
let ROWS=[],QUOTES={},sortKey='n',sortDir=-1,openTk=null,q='';

const clock=document.getElementById('clock');
setInterval(()=>{clock.textContent=new Date().toLocaleTimeString('ru-RU',{timeZone:'Europe/Moscow'})},1000);

function mskDayStart(){
  const now=new Date();
  const msk=new Date(now.toLocaleString('en-US',{timeZone:'Europe/Moscow'}));
  const off=msk-now;
  const d0=new Date(msk.getFullYear(),msk.getMonth(),msk.getDate());
  return new Date(d0.getTime()-off);
}
function hhmm(iso){return new Date(iso).toLocaleTimeString('ru-RU',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit'})}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtChg(v){
  if(v==null||isNaN(v))return'<span class="chg na">—</span>';
  const s=(v>0?'+':'')+v.toFixed(2)+'%';
  return'<span class="chg '+(v>0?'up':v<0?'dn':'na')+'">'+s+'</span>';
}

function buildRows(items){
  const t0=mskDayStart().getTime();
  const by={};
  for(const x of items){
    if(new Date(x.time).getTime()<t0)continue;
    for(const t of (x.tk||[])){
      if(!by[t])by[t]={tk:t,n:0,imp:0,last:0,news:[]};
      by[t].n++;
      if(x.lvl===2)by[t].imp++;
      const tm=new Date(x.time).getTime();
      if(tm>by[t].last)by[t].last=tm;
      by[t].news.push(x);
    }
  }
  ROWS=Object.values(by);
  for(const r of ROWS){
    r.nm=NAMES[r.tk]||'';
    r.news.sort((a,b)=>new Date(b.time)-new Date(a.time));
    const qd=QUOTES[r.tk];
    r.chg=qd&&qd.chg!=null?qd.chg:null;
  }
}
function applyQuotes(){
  for(const r of ROWS){const qd=QUOTES[r.tk];r.chg=qd&&qd.chg!=null?qd.chg:null}
}

function render(){
  const tb=document.getElementById('tb');
  let rows=ROWS.slice();
  if(q){
    const s=q.toLowerCase();
    rows=rows.filter(r=>r.tk.toLowerCase().includes(s)||r.nm.toLowerCase().includes(s));
  }
  rows.sort((a,b)=>{
    let va=a[sortKey],vb=b[sortKey];
    if(sortKey==='chg'){if(va==null)va=sortDir===-1?-Infinity:Infinity;if(vb==null)vb=sortDir===-1?-Infinity:Infinity}
    if(typeof va==='string')return va.localeCompare(vb,'ru')*sortDir;
    return (va-vb)*sortDir;
  });
  if(!rows.length){tb.innerHTML='<tr><td colspan="7" class="note">'+(q?'Ничего не нашлось.':'Сегодня новостей с тикерами ещё не было.')+'</td></tr>';return}
  const max=Math.max(...ROWS.map(r=>r.n));
  let h='';
  for(const r of rows){
    h+='<tr class="r" data-tk="'+r.tk+'">'+
      '<td class="tkc">'+r.tk+'</td>'+
      '<td class="nm">'+esc(r.nm)+'</td>'+
      '<td class="num">'+r.n+'</td>'+
      '<td class="flowtd"><div class="flow"><i style="width:'+Math.round(r.n/max*100)+'%"></i></div></td>'+
      '<td class="imp">'+(r.imp||'')+'</td>'+
      '<td>'+fmtChg(r.chg)+'</td>'+
      '<td class="tm">'+hhmm(r.last)+'</td></tr>';
    if(openTk===r.tk){
      h+='<tr class="det"><td colspan="7"><div class="dbox">'+
        r.news.map(x=>'<div class="dn1"><span class="dt">'+hhmm(x.time)+'</span><span class="dx">'+
          (x.lvl===2?'<span class="dimp">⚡ </span>':'')+esc(x.text.slice(0,180))+(x.text.length>180?'…':'')+
          ' <a target="_blank" rel="noopener" href="'+x.url+'">источник ↗</a></span></div>').join('')+
        '</div></td></tr>';
    }
  }
  tb.innerHTML=h;
  tb.querySelectorAll('tr.r').forEach(tr=>tr.onclick=e=>{
    if(e.target.closest('a'))return;
    openTk=openTk===tr.dataset.tk?null:tr.dataset.tk;
    render();
  });
  document.querySelectorAll('th[data-s]').forEach(th=>{
    th.querySelector('.ar').textContent=th.dataset.s===sortKey?(sortDir===-1?'▼':'▲'):'';
  });
}

document.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.s;
  if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=(k==='tk'||k==='nm')?1:-1}
  render();
});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();render()});

async function load(){
  try{
    const r=await fetch('/api/feed');
    const data=await r.json();
    buildRows(data.items||[]);
    render();
  }catch(e){
    document.getElementById('tb').innerHTML='<tr><td colspan="7" class="note">Не удалось загрузить данные. Обнови страницу.</td></tr>';
  }
  try{
    const r2=await fetch('/api/quotes');
    const d2=await r2.json();
    QUOTES=d2.quotes||{};
    applyQuotes();
    render();
  }catch(e){}
}
load();
setInterval(load,90000);
</script>
</body>
</html>
